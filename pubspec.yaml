name: quran
description: Aplikasi Quran — Murojaah, Murottal, Tafsir, Doa, Shalat.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.11.0
  flutter: ^3.41.0

dependencies:
  flutter:
    sdk: flutter

  # Functional Programming / Error Handling
  fpdart: ^1.1.1

  # Routing
  go_router: ^17.3.0

  # Networking
  dio: ^5.7.0

  # Local Storage
  shared_preferences: ^2.3.4

  # UI
  flutter_svg: ^2.0.16
  google_fonts: ^8.2.0
  shimmer: ^3.0.0

  # Utilities
  path_provider: ^2.1.5
  # Ekspor cadangan lewat share sheet sistem.
  share_plus: ^11.1.0
  connectivity_plus: ^7.3.1

  # Audio
  just_audio: ^0.9.40

  # Location (Shalat)
  geolocator: ^13.0.2
  geocoding: ^3.0.0
  # Arah kiblat: heading kompas (0-360, null bila tanpa sensor).
  flutter_compass: ^0.8.1

  # Notifications
  flutter_local_notifications: ^19.5.0
  timezone: ^0.10.1
  permission_handler: ^12.0.3
  recite_quran: ^1.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  # Testing
  mocktail: ^1.0.4

  # Linting
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/
    - assets/icons/
    - assets/images/
    - assets/quran/
    - docs/quran/murojaah/poc/samples/

  fonts:
    - family: Amiri
      fonts:
        - asset: assets/fonts/Amiri-Regular.ttf
        - asset: assets/fonts/Amiri-Bold.ttf
          weight: 700
